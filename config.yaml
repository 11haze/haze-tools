# RAN Online farming bot configuration.
# All coordinates are in CLIENT-AREA pixels (0,0 = top-left of the game view,
# not the window border). calibrate.py (Prompt 2) overwrites the regions,
# no_click_zones and colors sections.

window:
  title: "Ran Online Omega"        # exact (or partial) game window title - CHANGE ME
  width: 1024                # client-area size the coordinates below were made for
  height: 768
  mode: windowed

kill_switch: f12             # global hotkey, stops everything instantly

skills:                      # rotation order; cooldown in seconds (in-game values)
  - { key: "1", cooldown: 4.2 }
  - { key: "2", cooldown: 3.6 }
  - { key: "3", cooldown: 3.8 }
cooldown_margin: 0.15        # added to every cooldown so lag doesn't make a press too early

targets:
  # Mob names to attack. Edit freely - no code changes needed.
  #   "Hum"         exact name only (case and spaces ignored)
  #   "Totoy Bato"  multi-word names work as-is
  #   "Die*"        anything starting with "Die" (Die-8, Die-16, ...)
  whitelist: ["Die*", "Hum", "Little Hooligan", "Chief Hooligan",
              "Brawler", "Bruiser", "Slugger", "Slasher"]

detector:
  self_exclusion: [420, 336, 170, 30]   # your own name/icons above your character
  player_position: [512, 390]           # your character's body; targets are sorted by distance to it
  click_offset_y: 45        # click this many px below the label center (the mob's body)
  ocr_min_score: 0.5        # ignore OCR reads less confident than this

timing:                      # fixed delays in seconds
  min_cast_interval: 0.3     # main speed knob: at least this long between casts
                             # (0.3s = ~3 skill+right-click casts per second)
  key_hold: 0.02             # how long a key is held down
  key_to_click: 0.03         # skill key -> right-click
  click_hold: 0.02
  after_action: 0.05         # pause after each cast / move
  acquire_timeout: 0.5       # wait this long for the target frame after casting
  poll_interval: 0.05
  potion_cooldown: 1.0       # min seconds between potions of the same kind
acquire_max_tries: 3         # targets to try per scan before giving up

farming:
  scan_interval: 0.5         # seconds between scans when nothing is in sight
  skip_failed_seconds: 5.0   # ignore a spot where acquiring failed for this long

sidestep:                    # walk a few steps (left-click ground) to un-merge nameplates
  enabled: true
  distance: 0.25             # how far, as a fraction of the screen (0.2-0.3)
  in_fight_after: 1.0        # in a fight: target box shows the mob but its nameplate
                             # has been hidden this long
  no_target_after: 1.5       # searching: nothing targetable this long while HP drops
  cooldown: 2.0              # at most one sidestep per this many seconds
  wait_after: 0.4            # let the character walk before looking again

combat:
  spam_casting: true         # ON: ignore tracked cooldowns - press skills 1,2,3,1,... every
                             # timing.min_cast_interval (the game skips any still cooling
                             # down) and right-click the target every click_interval.
                             # OFF: cast each skill only when its tracked cooldown is up.
  click_interval: 0.1        # spam mode: right-click the target at least this often
  attack_until_dead: true    # keep attacking until the target dies (no time limit)
  max_fight_seconds: 20      # only used when attack_until_dead is false
  target_lost_grace: 0.4     # target frame must stay gone this long before the fight ends
  nameplate_lost_timeout: 3.0  # end the fight if neither the mob's nameplate nor its name
                               # in the target box has been seen for this long
  box_name_check_interval: 0.5 # how often to read the name in the target box

thresholds:                  # percent of bar
  hp_potion: 50              # drink HP potion below this
  mp_potion: 30              # drink MP potion below this
  hp_critical: 20            # safety pause if HP stays below this

potions:
  hp_key: q
  mp_key: w

loot:
  mode: spacebar             # after a kill: "spacebar" presses SPACE, "pet" waits pet_wait
  pet_wait: 1.0              # seconds to wait for the pet to pick up
  spacebar_presses: 2        # SPACE presses right after a kill (~0.05s apart)
  space_while_fighting: true # press SPACE during fights so drops are picked up right away
  space_interval: 0.5        # seconds between those SPACE presses

# Rough defaults estimated from screenshots at 1024x768. [x, y, width, height]
no_click_zones:
  chat: [0, 610, 445, 158]
  menu_bar: [645, 665, 379, 103]
  minimap: [890, 10, 134, 140]
  skill_bar_left: [0, 0, 49, 482]
  skill_bar_top: [205, 0, 235, 40]
  hud_icons: [465, 0, 155, 38]
  clock_map_name: [690, 0, 334, 20]
  target_info: [650, 630, 193, 43]
  status_bars: [48, 0, 157, 56]

# Filled by calibrate.py: hp_bar, mp_bar, target_frame_search.
# target_frame_search = area searched for the target info box. The box moves
# between UI layouts and its width follows the name, so it is found, not fixed.
# The target's HP bar floats under its nameplate and is found automatically too.
regions:
  hp_bar: [73, 4, 130, 6]
  mp_bar: [73, 18, 130, 6]
  target_frame_search: [0, 384, 1024, 384]

# Filled by calibrate.py: HSV ranges (OpenCV: H 0-179, S/V 0-255).
# h: [170, 10] means the hue range wraps around red.
colors:
  hp_fill:
    h: [170, 10]
    s: [150, 255]
    v: [100, 255]
  mp_fill:
    h: [107, 127]
    s: [150, 255]
    v: [100, 255]
  target_hp_fill:
    h: [170, 12]
    s: [150, 255]
    v: [120, 255]
  target_hp_empty:
    h: [0, 179]
    s: [0, 30]
    v: [20, 110]

logging:
  dir: logs
